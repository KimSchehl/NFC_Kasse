; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = nordicnrf52
board = nicenano
framework = arduino
upload_protocol = nrfutil
lib_deps =
    adafruit/Adafruit PN532@^1.3.4

; Each physical reader gets its own serial baked in at flash time, so it shows
; up as a distinct BLE device name (e.g. "NFC-Reader_0001") when several
; readers are in range at once. Add one [env:nicenano_NNNN] block per unit
; and flash it with `pio run -e nicenano_0001 -t upload`.
[env:nicenano_0001]
build_flags = -D READER_SERIAL=\"0001\"
